<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owl & Quill — Harry Potter Books</title><link rel="stylesheet" href="/css/style.css"></head><body><header><div class="brand">Owl & Quill</div><nav><a href="#books">Books</a><button id="cartBtn">Cart <span id="cartCount">0</span></button></nav></header><main><section class="hero"><p class="eyebrow">Independent Bookshop</p><h1>Harry Potter — English Editions</h1><p>Seven books. One simple place to order.</p></section><section id="books"><h2>Books</h2><div id="bookGrid" class="grid"><p>Loading books…</p></div></section></main><aside id="cartDrawer" class="drawer"><div class="drawerHead"><h2>Your cart</h2><button id="closeCart">×</button></div><div id="cartItems"></div><div class="total">Total <strong id="cartTotal">฿0</strong></div><button id="checkoutBtn" class="primary">Checkout</button></aside><div id="overlay" class="overlay"></div><dialog id="checkoutDialog"><form id="checkoutForm"><h2>Checkout</h2><label>Name<input id="customerName" required></label><label>Phone / Line<input id="contact" required></label><label>Address<textarea id="address"></textarea></label><label>Note<textarea id="note"></textarea></label><div class="dialogActions"><button type="button" id="cancelCheckout">Cancel</button><button class="primary" type="submit">Place order</button></div></form></dialog><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/app.js"></script></body></html>
