<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Harry Potter Bookstore</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<header class="site-header"><div class="container nav"><a class="brand" href="/">Harry Potter Bookstore</a><a class="admin-link" href="/admin.html">Admin</a></div></header>
<main class="container"><section class="hero"><h1>Harry Potter Bookstore</h1><p>Harry Potter English Edition</p></section>
<section><h2>Books</h2><div id="products" class="products-grid"><p class="muted">กำลังโหลดสินค้า...</p></div></section></main>
<aside class="cart-panel"><div class="cart-header"><h2>Cart</h2><span id="cart-count">0</span></div>
<div id="cart-items"></div><div class="cart-total"><span>Total</span><strong id="cart-total">฿0.00</strong></div>
<button id="checkout-btn" class="primary-btn" disabled>Checkout</button></aside>
<dialog id="checkout-dialog"><form id="checkout-form" class="checkout-form"><button type="button" id="close-dialog" class="close-btn">×</button>
<h2>ข้อมูลการสั่งซื้อ</h2><label>ชื่อลูกค้า<input id="customer_name" required></label>
<label>เบอร์โทร<input id="phone"></label><label>Line ID<input id="line_id"></label>
<label>ที่อยู่<textarea id="address" rows="3"></textarea></label><label>หมายเหตุ<textarea id="note" rows="2"></textarea></label>
<button class="primary-btn" type="submit">ยืนยันการสั่งซื้อ</button><p id="checkout-error" class="error"></p></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/app.js"></script>
</body></html>
